# SonarQube local analysis config for yomibako
# Run from project root with: powershell -ExecutionPolicy Bypass -File scripts/sonar-scan.ps1
# Docs: https://docs.sonarsource.com/sonarqube/latest/analyzing-source-code/scanners/sonarscanner/

sonar.projectKey=yomibako
sonar.projectName=yomibako
sonar.projectVersion=1.0.0

# Main sources (keep build / dep / generated output out of `sonar.sources`)
sonar.sources=src,App.tsx,index.ts,app.json
sonar.sourceEncoding=UTF-8

# Tests live under src/**/__tests__ (see tsconfig.test.json) plus top-level test/ shims
sonar.tests=src,test
sonar.test.inclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.test.js

# Never analyse these as source nor as test
sonar.exclusions=\
  **/node_modules/**,\
  **/coverage/**,\
  **/.test-out/**,\
  **/.expo/**,\
  **/android/**,\
  **/ios/**,\
  **/dist/**,\
  **/web-build/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.test.js,\
  **/__tests__/**

# Coverage (produced by `npm run test:coverage` -> coverage/lcov.info).
# Mirrors the c8 scope in package.json (bundles + useWordAudio are excluded
# there too). .tsx / App.tsx / index.ts have no headless harness (node:test,
# no RN renderer) so they can never report coverage; issues are still analysed.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=\
  **/*.test.*,\
  **/__tests__/**,\
  test/**,\
  scripts/**,\
  coverage/**,\
  .test-out/**,\
  **/*.tsx,\
  App.tsx,\
  index.ts,\
  **/yomibakoBundle.ts,\
  **/browserBundle.ts,\
  **/useWordAudio.ts

sonar.host.url=http://localhost:9000
# Auth is passed on the CLI via -Dsonar.token=%SONAR_TOKEN% so the token
# is never committed. Do NOT add sonar.token / sonar.login here.
